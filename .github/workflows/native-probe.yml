name: azure-blobs native Windows ARM64
on:
  push:
    branches: [codex/azure-blobs-arm64-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/azure-storage-blobs-cpp-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified native Azure Core prerequisite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path C:/azure-blobs-prereqs/win-arm64 -Force | Out-Null
          gh run download 34689205269 --repo ClayWarren/azure-core-cpp-feedstock --name azure-core-arm64-package --dir "$env:RUNNER_TEMP/azure-core"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/azure-core" -Recurse -Filter 'azure-core-cpp-1.16.3-hef4af3d_1.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '1facca313f69e8332f935f961351763414348496c257df04cd14fa61c3c687dc') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/azure-blobs-prereqs/win-arm64/
      - name: Retrieve verified native Azure Storage Common prerequisite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34689670571 --repo ClayWarren/azure-storage-common-cpp-feedstock --name azure-storage-common-arm64-package --dir "$env:RUNNER_TEMP/azure-storage-common"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/azure-storage-common" -Recurse -Filter 'azure-storage-common-cpp-12.14.0-hecb4063_2.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne 'ad3cd8895f282b4d4746a777f1c05ab8babc46d24e5ba52b66a805601b5bf8e5') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/azure-blobs-prereqs/win-arm64/
      - name: Build and test azure-blobs
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          CONDA_CHANNEL_PRIORITY: strict
          EXTRA_CB_OPTIONS: '--override-channels -c file:///C:/azure-blobs-prereqs -c conda-forge'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve azure-blobs package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azure-blobs-arm64-package
          path: C:\bld\**\*.conda
          if-no-files-found: warn
          retention-days: 7
